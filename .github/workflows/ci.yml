name: CI

on:
  push:
    branches: [main, staging, "release-*"]
  pull_request:
    branches: [main, staging, "release-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela a execução anterior em PR; num push em staging ou main, cada commit roda até o fim.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Tipos
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Testes
        run: bun run test
      - name: Build (preset Vercel)
        run: bun run build
      # Varredura de dependências (boaspraticas.md). Falha em vulnerabilidade alta ou crítica.
      - name: Auditoria de dependências
        run: bun audit --audit-level=high
      # api:verificar e o E2E rodam no job e2e, que baixa o back (o contrato vive no repositório dele).

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: scoutvela-frontend
          persist-credentials: false
      # O nome da branch é controlado por quem abre o PR: passa por env, nunca direto no script.
      # Ordem de tentativa: a branch do PR (num push, a do PR que gerou o commit), a base, a branch
      # do push e, por fim, a staging. Num push em staging, a branch do PR evita pegar o back
      # antes do merge correspondente (ver "Ordem de entrada" no README).
      - name: Escolher a branch do back
        id: back
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DONO: ${{ github.repository_owner }}
          EVENTO: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_REF=""
          if [ "$EVENTO" = "push" ]; then
            PR_REF=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.ref' 2>/dev/null || true)
          fi
          for ref in "$HEAD_REF" "$PR_REF" "$BASE_REF" "$REF_NAME" staging; do
            [ -z "$ref" ] && continue
            # refs/heads/ casa o nome exato (sem isso, "staging" casaria também "x/staging").
            if git ls-remote --exit-code --heads "https://github.com/$DONO/scoutvela-backend.git" "refs/heads/$ref" > /dev/null; then
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "Branch do back: $ref"
              exit 0
            fi
          done
          echo "Nenhuma branch do back encontrada." >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/scoutvela-backend
          ref: ${{ steps.back.outputs.ref }}
          path: scoutvela-backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependências do back
        working-directory: scoutvela-backend
        run: npm ci
      - name: Instalar dependências do front
        working-directory: scoutvela-frontend
        run: bun install --frozen-lockfile
      - name: Contrato da API
        working-directory: scoutvela-frontend
        run: bun run api:verificar
      - name: E2E
        working-directory: scoutvela-frontend
        run: bun run e2e
      - name: Guardar resultados do E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: scoutvela-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
